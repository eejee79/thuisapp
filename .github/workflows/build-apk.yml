name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Gegevens en sleutel komen uit de repository-secrets, nooit uit de code
      - name: Gegevens en sleutel klaarzetten
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_URL_LOCAL: ${{ secrets.HA_URL_LOCAL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          PVE_URL: ${{ secrets.PVE_URL }}
          PVE_TOKEN_ID: ${{ secrets.PVE_TOKEN_ID }}
          PVE_SECRET: ${{ secrets.PVE_SECRET }}
          FRITZ_URL: ${{ secrets.FRITZ_URL }}
          FRITZ_USER: ${{ secrets.FRITZ_USER }}
          FRITZ_PASS: ${{ secrets.FRITZ_PASS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          GH_UPDATE_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: |
          {
            echo "HA_URL=$HA_URL"
            echo "HA_URL_LOCAL=$HA_URL_LOCAL"
            echo "HA_TOKEN=$HA_TOKEN"
            echo "PVE_URL=$PVE_URL"
            echo "PVE_TOKEN_ID=$PVE_TOKEN_ID"
            echo "PVE_SECRET=$PVE_SECRET"
            echo "FRITZ_URL=$FRITZ_URL"
            echo "FRITZ_USER=$FRITZ_USER"
            echo "FRITZ_PASS=$FRITZ_PASS"
          } > local.properties
          # Optioneel: GitHub-token voor updates in de app (anders in de app invullen)
          if [ -n "$GH_UPDATE_TOKEN" ]; then echo "GH_UPDATE_TOKEN=$GH_UPDATE_TOKEN" >> local.properties; fi
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > thuisapp.jks; fi

      # Controleert de secrets op veelgemaakte kopieerfouten, zonder ze te tonen
      - name: Secrets controleren
        run: |
          ok=1
          check() {  # naam, waarde
            if [ -z "$2" ]; then echo "::warning::$1 is leeg"; ok=0; return; fi
            case "$2" in "$1="*) echo "::error::$1 begint met '$1=' - plak alleen het deel na het eerste =-teken"; ok=0;; esac
            case "$2" in *" "*) echo "::warning::$1 bevat een spatie";; esac
          }
          while IFS='=' read -r k v; do [ -n "$k" ] && check "$k" "$v"; done < local.properties
          T=$(grep '^HA_TOKEN=' local.properties | cut -d= -f2-)
          DOTS=$(printf '%s' "$T" | tr -cd '.' | wc -c)
          echo "HA_TOKEN: lengte ${#T} (verwacht 183), punten $DOTS (verwacht 2), begint met eyJ: $(case "$T" in eyJ*) echo ja;; *) echo NEE;; esac)"
          case "$T" in eyJ*) ;; *) echo "::error::HA_TOKEN begint niet met eyJ"; ok=0;; esac
          [ "$DOTS" = "2" ] || { echo "::error::HA_TOKEN heeft geen 2 punten - waarschijnlijk niet volledig gekopieerd"; ok=0; }
          [ "$ok" = "1" ] && echo "Secrets zien er goed uit."
          [ "$ok" = "1" ]

      - name: APK bouwen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "thuisapp-$VERSION.apk"

      - name: Gegevens opruimen
        if: always()
        run: rm -f local.properties thuisapp.jks

      - uses: actions/upload-artifact@v4
        with:
          name: thuisapp-${{ env.VERSION }}
          path: thuisapp-*.apk

      # Vaste plek om te downloaden: Releases → nieuwste
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Thuisapp ${{ env.VERSION }} (build ${{ github.run_number }})
          files: thuisapp-*.apk
          make_latest: true
